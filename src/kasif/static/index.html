function docIcon(kind) {
  const col = kind === "demo" ? "#ff9500" : kind === "csv" ? "#34c759" : "#007aff", label = kind === "demo" ? "DEMO" : kind.toUpperCase();
  return `<svg class="doc" viewBox="0 0 58 72"><path d="M4 2h36l16 16v50a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" fill="var(--card)" stroke="var(--sep-2)"/><path d="M40 2v14a2 2 0 0 0 2 2h14" fill="var(--win-2)" stroke="var(--sep-2)"/>
    <rect x="8" y="46" width="42" height="16" rx="4" fill="${col}"/><text x="29" y="57.5" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="var(--font)">${label}</text>
    <path d="M10 26h30M10 32h30M10 38h20" stroke="var(--fill-2)" stroke-width="2" stroke-linecap="round"/></svg>`;
}
async function renderDatasets() {
  const box = $("#files"); let list = [];
  try { list = await api("/datasets"); } catch { box.innerHTML = `<div class="empty-note">${t("err")}</div>`; return; }
  box.innerHTML = list.map((d, i) => `<div class="file ${d.active ? "on" : ""}" style="animation-delay:${i * 50}ms" data-id="${d.id}">${docIcon(d.kind)}<b>${esc(d.name)}</b><small>${d.tables} ${t("fact.tables")} · ${num(d.rows)} ${t("fact.rows")}</small>
    <div class="acts">${d.active ? "" : `<button class="btn" data-use="${d.id}">${t("ds.use")}</button>`}${d.kind !== "demo" ? `<button class="ib" data-del="${d.id}" data-name="${esc(d.name)}" title="${t("ds.del")}">${ic("trash")}</button>` : ""}</div></div>`).join("");
  $$("[data-use]", box).forEach((b) => (b.onclick = async () => { const d = await api(`/datasets/${b.dataset.use}/activate`, { method: "POST" }); await switched(); notify(t("ds.switched", { name: d.name })); renderDatasets(); }));
  $$(".file", box).forEach((f) => (f.ondblclick = () => $(`[data-use="${f.dataset.id}"]`, f)?.click()));
  $$("[data-del]", box).forEach((b) => (b.onclick = async () => { if (!confirm(t("ds.confirm", { name: b.dataset.name }))) return; await api(`/datasets/${b.dataset.del}`, { method: "DELETE" }); notify(t("ds.deleted")); await switched(); renderDatasets(); }));
  $("#dsNotes").innerHTML = [1, 2, 3].map((n) => `<div class="note"><b>${t("n" + n)}</b>${t("n" + n + "d")}</div>`).join("");
}
async function switched() { schema = null; await loadStatus(); await loadSchema(); }
async function upload(file) {
  notify(t("ds.uploading", { name: file.name }));
  const fd = new FormData(); fd.append("file", file);
  try { const d = await api("/datasets", { method: "POST", body: fd }); await switched(); notify(t("ds.added", { name: d.name })); } catch (e) { notify(e.message); }
  show("datasets");
}
const drop = $("#drop"), file = $("#file");
drop.onclick = () => file.click(); drop.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } };
file.onchange = () => { if (file.files[0]) upload(file.files[0]); file.value = ""; };
let dragN = 0; const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
const hideDrop = () => { dragN = 0; $("#dropzone").classList.remove("on"); };
addEventListener("dragenter", (e) => { if (!hasFiles(e)) return; e.preventDefault(); dragN++; $("#dropzone").classList.add("on"); });
addEventListener("dragover", (e) => { if (hasFiles(e)) e.preventDefault(); });
addEventListener("dragleave", (e) => { if (!e.relatedTarget || --dragN <= 0) hideDrop(); });
addEventListener("drop", (e) => { hideDrop(); if (!hasFiles(e)) return; e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) upload(f); });

/* ---------------------------------------------------------------- Ayarlar penceresi */
const PTABS = [["general", "gear", "#8e8e93"], ["model", "cpu", "#af52de"], ["safety", "shield", "#34c759"], ["about", "info", "#007aff"]];
let ptab = "general";
function openPrefs(tab) { ptab = tab || "general"; $("#prefs").classList.add("open"); renderPrefs(); }
$("#prefs").onclick = (e) => { if (e.target.id === "prefs" || e.target.closest("[data-close]")) $("#prefs").classList.remove("open"); };
function seg(name, items, cur) { return `<div class="seg" data-seg="${name}"><span class="thumb"></span>${items.map(([v, l]) => `<button data-v="${v}" class="${cur === v ? "on" : ""}">${l}</button>`).join("")}</div>`; }
function renderPrefs() {
  $("#ptabs").innerHTML = PTABS.map(([k, icn, col]) => `<button class="ptab ${k === ptab ? "on" : ""}" data-p="${k}"><span class="ic" style="--k:${col}">${ic(icn)}</span>${t("p." + k)}</button>`).join("");
  $$("#ptabs .ptab").forEach((b) => (b.onclick = () => { ptab = b.dataset.p; renderPrefs(); }));
  $("#pwTitle").textContent = t("p." + ptab);
  const s = status?.llm, lim = status?.limits || { max_rows: 1000, timeout_s: 5 };
  const body = {
    general: `<div class="form"><label>${t("p.theme")}</label><div>${seg("theme", [["light", t("p.light")], ["dark", t("p.dark")], ["system", t("p.system")]], settings.theme)}</div>
      <label>${t("p.lang")}</label><div>${seg("lang", [["tr", "Türkçe"], ["en", "English"]], lang)}</div>
      <label>${t("p.mode")}</label><div>${seg("mode", [["auto", t("mode.auto")], ["rules", t("mode.rules")], ["llm", "LLM"]], settings.mode)}<div class="dim" style="font-size:12px;margin-top:6px">${t("p.modeD")}</div></div></div>`,
    model: s ? `<div class="form"><label>${t("p.status")}</label><div><span class="tag ${s.reachable ? "rules" : "sql"}"><span class="dot ${s.reachable ? "on" : "off"}"></span>${s.reachable ? t("p.on") : t("p.off")}</span></div>
      <label>${t("p.host")}</label><code>${esc(s.host)}</code><label>${t("p.model2")}</label><code>${esc(s.model)}</code></div>
      ${s.reachable ? "" : `<p style="margin:18px 0 8px;font-size:12.5px;color:var(--label-2)">${t("p.howto")}</p><pre class="term"><span class="c"># ~4,7 GB</span>\nollama pull ${esc(s.model)}</pre>`}` : "…",
    safety: `<div class="form"><label>${t("p.rows")}</label><code>${num(lim.max_rows)}</code><label>${t("p.timeout")}</label><code>${lim.timeout_s} s</code><label>${t("p.allowed")}</label><code>SELECT · WITH · UNION</code></div>
      <div class="how" style="margin-top:20px">${[["h1", "search", "#007aff"], ["h2", "code", "#5856d6"], ["h3", "shield", "#34c759"], ["h4", "bars", "#ff9500"]].map(([k, icn, col]) => `<div><i style="--k:${col}">${ic(icn)}</i><div><b>${t(k)}</b><p>${t(k + "d")}</p></div></div>`).join("")}</div>`,
    about: `<div class="about"><svg viewBox="0 0 128 128" style="width:80px;height:80px"><use href="#appicon"/></svg><h2>Kâşif</h2><p>${lang === "tr" ? "Sürüm" : "Version"} ${status?.version || ""}</p>
      <p style="max-width:440px;margin:12px auto">${t("p.eval")}</p><p><a href="/docs" target="_blank">API</a> · <a href="https://github.com/numanak-b221210105/kasif" target="_blank" rel="noopener">GitHub</a> · MIT · © Numan AK</p></div>`,
  }[ptab];
  $("#pwB").innerHTML = body;
  $$("#pwB .seg").forEach((sg) => { segThumb(sg); $$("button", sg).forEach((b) => (b.onclick = () => {
    const k = sg.dataset.seg, v = b.dataset.v;
    if (k === "theme") { settings.theme = v; saveSettings(); applyTheme(); }
    if (k === "mode") { settings.mode = v; saveSettings(); renderMode(); }
    if (k === "lang") { lang = v; store.set("lang", lang); loadSchema().then(applyI18n); applyI18n(); renderPrefs(); return; }
    $$("button", sg).forEach((x) => x.classList.toggle("on", x === b)); segThumb(sg);
  })); });
}

/* ---------------------------------------------------------------- karşılama penceresi */
function renderOnb() {
  $("#feats").innerHTML = [["w1", "search", "var(--blue)"], ["w2", "sbr", "var(--purple)"], ["w3", "shield", "var(--green)"]].map(([k, icn, col], i) => `<div class="feat" style="animation-delay:${150 + i * 90}ms"><i style="--k:${col}">${ic(icn)}</i><div><b>${t(k)}</b><span>${t(k + "d", { key: KEY })}</span></div></div>`).join("");
}
const closeOnb = () => { $("#onb").classList.remove("open"); store.set("welcomed", true); };
$("#wGo").onclick = () => { closeOnb(); openSpot(); };
$("#wData").onclick = () => { closeOnb(); show("datasets"); };

/* ---------------------------------------------------------------- klavye */
document.addEventListener("keydown", (e) => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#spot").classList.contains("open") ? closeSpot() : openSpot(); return; }
  if ((e.metaKey || e.ctrlKey) && e.key === ",") { e.preventDefault(); openPrefs(); return; }
  if (e.key === "Escape") { closeSpot(); closeSheet(); $$(".scrim.open").forEach((m) => m.classList.remove("open")); hideDrop(); return; }
  if (e.altKey && /^Digit[1-6]$/.test(e.code)) { e.preventDefault(); show(VIEWS[+e.code.slice(5) - 1]); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "/" || (e.key.length === 1 && (view === "explore" || view === "atlas") && /\p{L}/u.test(e.key))) { e.preventDefault(); openSpot(e.key === "/" ? "" : e.key); }
});

/* ---------------------------------------------------------------- başlangıç */
cells = cells.filter((c) => c.a); selected = cells[0]?.id || null;
applyTheme(); applyLayout(); renderMode(); fillRoses(); drawTopo(); applyI18n(); show("atlas");
loadStatus().then(loadSchema).then(() => { renderCells(); renderInspector(); });
document.fonts?.ready.then(() => { navThumb(); segThumb($("#modeSeg")); $$(".tabs .seg").forEach(segThumb); });
if (!store.get("welcomed", false)) setTimeout(() => $("#onb").classList.add("open"), 700);
</script>
</body>
