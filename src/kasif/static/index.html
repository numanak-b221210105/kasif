<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kâşif</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%233b9bff'/%3E%3Cstop offset='1' stop-color='%234a3fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='120' height='120' rx='28' fill='url(%23g)'/%3E%3Cpath d='M64 26 74 64H54z' fill='%23ff7a3a'/%3E%3Cpath d='M64 102 54 64h20z' fill='%23fff'/%3E%3C/svg%3E">
<style>
/* =====================================================================
   Kâşif — "veri atlası"
   Topoğrafik bir harita üzerinde yüzen cam paneller: rota (kenar çubuğu),
   keşif alanı ve seyir defteri. Pusula ile sor, rotayı izle.
   ===================================================================== */
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, sans-serif;
  --mono: "SF Mono", ui-monospace, Menlo, "Cascadia Mono", Consolas, monospace;
  --spring: cubic-bezier(.32, .72, 0, 1);
  --ease: cubic-bezier(.25, .8, .25, 1);
  --win: #ffffff; --win-2: #f5f5f7; --sb: rgba(232, 232, 237, .72); --tb: rgba(252, 252, 253, .82); --insp: #fbfbfd;
  --label: #1d1d1f; --label-2: #5e5e63; --label-3: #8e8e93; --label-4: #b8b8bd;
  --sep: rgba(0, 0, 0, .085); --sep-2: rgba(0, 0, 0, .14); --fill: rgba(120, 120, 128, .1); --fill-2: rgba(120, 120, 128, .16);
  --blue: #007aff; --blue-soft: rgba(0, 122, 255, .12); --orange: #ff9500; --green: #34c759; --red: #ff3b30; --purple: #af52de;
  --pink: #ff2d55; --teal: #30b0c7; --indigo: #5856d6; --yellow: #ffcc00; --mint: #00c7be;
  --card: #ffffff; --card-sh: 0 0 0 .5px rgba(0, 0, 0, .1), 0 1px 3px rgba(0, 0, 0, .06), 0 4px 14px -6px rgba(0, 0, 0, .1);
  --win-sh: 0 0 0 .5px rgba(0, 0, 0, .22), 0 22px 70px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .12);
  --pop-sh: 0 0 0 .5px rgba(0, 0, 0, .18), 0 24px 60px rgba(0, 0, 0, .28);
  --sel: #007aff; --sel-ink: #fff; --sb-sel: rgba(0, 0, 0, .085);
  --m1: #a9b8ec; --m2: #8b97d8; --m3: #6c75bf; --m4: #4f569f;
}
:root[data-theme="dark"] {
  --win: #1e1e20; --win-2: #19191b; --sb: rgba(40, 40, 46, .74); --tb: rgba(36, 36, 40, .84); --insp: #232326;
  --label: #f5f5f7; --label-2: #b0b0b6; --label-3: #8a8a90; --label-4: #5a5a60;
  --sep: rgba(255, 255, 255, .09); --sep-2: rgba(255, 255, 255, .15); --fill: rgba(120, 120, 128, .2); --fill-2: rgba(120, 120, 128, .3);
  --blue: #0a84ff; --blue-soft: rgba(10, 132, 255, .2); --orange: #ff9f0a; --green: #30d158; --red: #ff453a; --purple: #bf5af2;
  --pink: #ff375f; --teal: #40c8e0; --indigo: #5e5ce6; --yellow: #ffd60a; --mint: #63e6e2;
  --card: #2a2a2d; --card-sh: 0 0 0 .5px rgba(255, 255, 255, .1), 0 2px 8px rgba(0, 0, 0, .3);
  --win-sh: 0 0 0 .5px rgba(255, 255, 255, .14), 0 22px 70px rgba(0, 0, 0, .6), 0 8px 24px rgba(0, 0, 0, .4);
  --pop-sh: 0 0 0 .5px rgba(255, 255, 255, .16), 0 24px 60px rgba(0, 0, 0, .6);
  --sel: #0a84ff; --sb-sel: rgba(255, 255, 255, .1);
  --m1: #2b2f62; --m2: #212452; --m3: #181a40; --m4: #10112e;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 13.5px/1.45 var(--font); color: var(--label); -webkit-font-smoothing: antialiased; overflow: hidden; background: #6b7fa8; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--blue); text-decoration: none; } a:hover { text-decoration: underline; }
:focus-visible { outline: 3px solid var(--blue-soft); outline-offset: 1px; border-radius: 6px; }
::selection { background: var(--blue-soft); }
h1, h2, h3, h4 { margin: 0; font-family: var(--display); letter-spacing: -.01em; }
.mono { font-family: var(--mono); }
.dim { color: var(--label-3); }
::-webkit-scrollbar { width: 11px; height: 11px; } ::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { from { opacity: 0; transform: scale(.96); } }
@keyframes grow-x { from { transform: scaleX(0); } }
@keyframes grow-y { from { transform: scaleY(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade-to { to { opacity: 1; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -150% 0; } }

/* ---------- masaüstü & duvar kâğıdı ---------- */
.desk { position: fixed; inset: 0; overflow: hidden; }
.wall { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- pencere ---------- */
.win { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: min(1480px, calc(100vw - 48px)); height: calc(100vh - 70px); height: calc(100dvh - 70px);
  display: grid; grid-template-columns: 236px minmax(0, 1fr) 312px; border-radius: 12px; overflow: hidden; background: var(--win); box-shadow: var(--win-sh);
  transition: width .5s var(--spring), height .5s var(--spring), top .5s var(--spring), border-radius .5s var(--spring), grid-template-columns .45s var(--spring);
  animation: win-in .7s var(--spring) both; z-index: 2; }
@keyframes win-in { from { opacity: 0; transform: translateX(-50%) scale(.94) translateY(16px); } }
.win.no-sb { grid-template-columns: 0 minmax(0, 1fr) 312px; }
.win.no-insp { grid-template-columns: 236px minmax(0, 1fr) 0; }
.win.no-sb.no-insp { grid-template-columns: 0 minmax(0, 1fr) 0; }

/* kenar çubuğu */
.sb { min-width: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--sb); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8);
  border-right: .5px solid var(--sep-2); }
.sb-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 0 10px 10px; }
.sb-h { font: 700 11px var(--font); color: var(--label-3); padding: 14px 8px 5px; display: flex; align-items: center; }
.sb-h small { margin-left: auto; font-weight: 500; }
.sb-i { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: none; cursor: default; text-align: left;
  color: var(--label); font-size: 13px; transition: background .12s; }
.sb-i:hover { background: var(--sb-sel); }
.sb-i svg { width: 16px; height: 16px; color: var(--blue); flex: none; }
.sb-i.on { background: var(--sb-sel); font-weight: 600; }
.sb-i .n { margin-left: auto; font-size: 11.5px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.sb-i.tbl svg { color: var(--label-3); } .sb-i.tbl { font-family: var(--mono); font-size: 12px; }
.sb-foot { padding: 10px 12px 12px; border-top: .5px solid var(--sep); display: grid; gap: 8px; }
.ds { display: flex; align-items: center; gap: 10px; padding: 6px; border-radius: 8px; border: 0; background: none; cursor: default; text-align: left; width: 100%; }
.ds:hover { background: var(--sb-sel); }
.ds .ico { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center; color: #fff; flex: none; background: linear-gradient(160deg, #ffb340, #ff6a00); box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.ds .ico svg { width: 16px; height: 16px; }
.ds b { display: block; font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds small { display: block; font-size: 11px; color: var(--label-3); }
.st { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--label-2); padding: 0 6px; cursor: default; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--label-4); flex: none; }
.dot.on { background: var(--green); box-shadow: 0 0 6px var(--green); } .dot.off { background: var(--orange); }

/* ana bölme */
.mp { min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; background: var(--win); }
.tb { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 14px; border-bottom: .5px solid var(--sep); background: var(--tb);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); position: relative; z-index: 3; }
.tb .title { min-width: 0; margin-right: 6px; }
.tb .title b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb .title small { display: block; font-size: 11px; color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb .sp { flex: 1; }
.tbtn { height: 28px; min-width: 32px; padding: 0 7px; border: 0; border-radius: 6px; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: default;
  color: var(--label-2); transition: background .12s, color .12s; }
.tbtn:hover { background: var(--fill); color: var(--label); } .tbtn:active { background: var(--fill-2); }
.tbtn svg { width: 17px; height: 17px; } .tbtn.on { color: var(--blue); }
.search { display: flex; align-items: center; gap: 7px; height: 30px; width: min(380px, 34vw); padding: 0 6px 0 9px; border-radius: 8px; background: var(--fill); border: 0; cursor: text;
  color: var(--label-3); font-size: 13px; transition: background .15s, box-shadow .2s; }
.search:hover { background: var(--fill-2); }
.search svg { width: 14px; height: 14px; } .search span { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
kbd { font: 500 10.5px var(--font); padding: 1px 5px; border-radius: 4px; background: var(--win); box-shadow: 0 0 0 .5px var(--sep-2), 0 1px 0 var(--sep-2); color: var(--label-2); white-space: nowrap; }
.seg { display: inline-flex; position: relative; padding: 2px; border-radius: 7px; background: var(--fill); }
.seg button { position: relative; z-index: 1; height: 22px; padding: 0 10px; border: 0; background: none; border-radius: 5px; font-size: 12px; font-weight: 500; color: var(--label); cursor: default; white-space: nowrap; }
.seg .thumb { position: absolute; top: 2px; height: 22px; border-radius: 5px; background: var(--win); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .08), 0 1px 3px rgba(0, 0, 0, .15); transition: left .3s var(--spring), width .3s var(--spring); }
:root[data-theme="dark"] .seg .thumb { background: #636366; }
.views { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; display: none; padding: 22px 28px 40px; }
.view.on { display: block; animation: view-in .4s var(--spring); }
@keyframes view-in { from { opacity: 0; transform: translateY(6px); } }
.vh { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
.vh h1 { font-size: 26px; font-weight: 700; } .vh p { margin: 3px 0 0; color: var(--label-2); font-size: 13px; }
.vh .r { margin-left: auto; display: flex; gap: 8px; }

/* düğmeler */
.btn { height: 26px; padding: 0 12px; border-radius: 6px; border: 0; background: var(--win); box-shadow: 0 0 0 .5px var(--sep-2), 0 1px 1.5px rgba(0, 0, 0, .1); font-size: 13px; font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; cursor: default; white-space: nowrap; transition: filter .12s; }
:root[data-theme="dark"] .btn { background: #48484c; }
.btn:active { filter: brightness(.94); } .btn svg { width: 14px; height: 14px; }
.btn.pri { background: linear-gradient(#2a8cff, var(--blue)); color: #fff; box-shadow: 0 0 0 .5px rgba(0, 80, 200, .5), 0 1px 2px rgba(0, 0, 0, .15); }
.btn.lg { height: 32px; padding: 0 16px; border-radius: 8px; }
.btn.danger { color: var(--red); }
.ib { width: 26px; height: 26px; border: 0; border-radius: 6px; background: none; display: grid; place-items: center; color: var(--label-3); cursor: default; transition: background .12s, color .12s; }
.ib:hover { background: var(--fill); color: var(--label); } .ib.on { color: var(--blue); } .ib svg { width: 15px; height: 15px; }
.tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--fill); color: var(--label-2); white-space: nowrap; }
.tag svg { width: 11px; height: 11px; }
.tag.rules { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue); }
.tag.llm { background: color-mix(in srgb, var(--purple) 15%, transparent); color: var(--purple); }
.tag.sql { background: color-mix(in srgb, var(--orange) 16%, transparent); color: var(--orange); }
.tag.bad { background: color-mix(in srgb, var(--red) 14%, transparent); color: var(--red); }
.skel { background: linear-gradient(90deg, var(--fill) 25%, var(--fill-2) 50%, var(--fill) 75%); background-size: 300% 100%; animation: shimmer 1.3s linear infinite; border-radius: 6px; }
.empty-note { padding: 40px 0; text-align: center; color: var(--label-3); }

/* ---------- karşılama (boş durum) ---------- */
.home { max-width: 860px; margin: 3vh auto 0; text-align: center; }
.appicon { width: 96px; height: 96px; margin: 0 auto; display: block; filter: drop-shadow(0 10px 20px rgba(0, 60, 160, .3)); animation: pop .8s var(--spring) both; }
.appicon .needle { transform-origin: 64px 64px; animation: settle 1.8s var(--spring) .2s both; }
@keyframes settle { 0% { transform: rotate(-160deg); } 60% { transform: rotate(14deg); } 100% { transform: rotate(0); } }
.busy .appicon .needle, .busy .mini .needle { animation: seek 1s ease-in-out infinite alternate; }
@keyframes seek { from { transform: rotate(-40deg); } to { transform: rotate(40deg); } }
.home h1 { font-size: 30px; font-weight: 700; margin: 18px 0 6px; letter-spacing: -.02em; animation: rise .6s var(--spring) .1s both; }
.home > p { color: var(--label-2); font-size: 14.5px; max-width: 560px; margin: 0 auto; animation: rise .6s var(--spring) .15s both; }
.bigsearch { display: flex; align-items: center; gap: 12px; width: min(620px, 100%); height: 52px; margin: 26px auto 0; padding: 0 12px 0 18px; border: 0; border-radius: 14px; cursor: text;
  background: var(--card); box-shadow: var(--card-sh), 0 12px 32px -14px rgba(0, 0, 0, .25); color: var(--label-3); font-size: 16px; animation: rise .6s var(--spring) .2s both; transition: transform .25s var(--spring), box-shadow .25s; }
.bigsearch:hover { transform: translateY(-1px); box-shadow: var(--card-sh), 0 18px 40px -14px rgba(0, 0, 0, .3); }
.bigsearch svg { width: 20px; height: 20px; color: var(--label-3); } .bigsearch span { flex: 1; text-align: left; }
.tiles-h { margin: 34px 0 10px; text-align: left; font: 700 13px var(--font); color: var(--label-2); display: flex; align-items: center; gap: 8px; animation: rise .6s var(--spring) .25s both; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; text-align: left; }
.tile { position: relative; min-height: 96px; padding: 12px 13px; border: 0; border-radius: 14px; color: #fff; cursor: default; display: flex; flex-direction: column; justify-content: space-between;
  background: linear-gradient(150deg, var(--a), var(--b)); box-shadow: 0 1px 2px rgba(0, 0, 0, .12), 0 8px 20px -12px var(--b); text-align: left; overflow: hidden;
  animation: pop .55s var(--spring) both; transition: transform .3s var(--spring), box-shadow .3s; }
.tile:hover { transform: translateY(-3px) scale(1.015); box-shadow: 0 2px 4px rgba(0, 0, 0, .12), 0 16px 30px -12px var(--b); }
.tile:active { transform: scale(.98); }
.tile svg { width: 22px; height: 22px; opacity: .95; }
.tile b { font-size: 13.5px; font-weight: 600; line-height: 1.3; text-shadow: 0 1px 1px rgba(0, 0, 0, .1); }
.tile::after { content: ""; position: absolute; right: -20px; top: -20px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255, 255, 255, .12); }

/* ---------- hücreler ---------- */
.cells { display: flex; flex-direction: column; gap: 16px; max-width: 980px; margin: 0 auto; }
.cell { background: var(--card); border-radius: 12px; box-shadow: var(--card-sh); overflow: hidden; animation: cell-in .55s var(--spring) both; transition: box-shadow .2s; cursor: default; }
@keyframes cell-in { from { opacity: 0; transform: translateY(12px) scale(.985); } }
.cell.sel { box-shadow: 0 0 0 3px var(--blue-soft), 0 0 0 1px var(--blue), 0 4px 14px -6px rgba(0, 0, 0, .15); }
.ch { display: flex; align-items: flex-start; gap: 10px; padding: 14px 14px 10px 16px; }
.ch .q { flex: 1; min-width: 0; }
.ch h3 { font-size: 16px; font-weight: 650; line-height: 1.35; }
.ch h3 u { text-decoration: underline wavy var(--red); text-underline-offset: 4px; }
.ch .meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 11.5px; color: var(--label-3); }
.ch .acts { display: flex; gap: 1px; opacity: .55; transition: opacity .15s; } .cell:hover .acts, .cell.sel .acts { opacity: 1; }
.understood { padding: 0 16px 10px; font-size: 12.5px; color: var(--label-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.understood i { font-style: normal; color: var(--label-4); }
.understood span b { font-weight: 600; color: var(--label); }
.sum { padding: 0 16px 14px; display: grid; gap: 5px; }
.sum p { margin: 0; font-size: 14px; color: var(--label-2); line-height: 1.5; animation: rise .45s var(--spring) both; }
.sum p b { color: var(--label); font-weight: 650; }
.sum.kpi-only { display: none; }
.tabs { display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-top: .5px solid var(--sep); }
.tabs .sp { flex: 1; } .tabs small { font: 11px var(--mono); color: var(--label-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pane { display: none; } .pane.on { display: block; animation: fade .3s; }
.pane.chart { padding: 6px 18px 18px; }
.err { margin: 0 16px 14px; padding: 12px 14px; border-radius: 10px; background: color-mix(in srgb, var(--orange) 12%, transparent); display: flex; gap: 10px; }
.err.hard { background: color-mix(in srgb, var(--red) 10%, transparent); }
.err > svg { width: 18px; height: 18px; color: var(--orange); flex: none; } .err.hard > svg { color: var(--red); }
.err b { display: block; } .err p { margin: 2px 0 0; color: var(--label-2); font-size: 13px; } .err .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 16px; }
.chipq { height: 26px; padding: 0 11px; border-radius: 99px; border: 0; background: var(--fill); font-size: 12.5px; cursor: default; display: inline-flex; align-items: center; gap: 5px; transition: background .12s, color .12s; }
.chipq:hover { background: var(--blue-soft); color: var(--blue); } .chipq svg { width: 12px; height: 12px; }
.warn { margin: 0 16px 10px; font-size: 12px; color: var(--orange); display: flex; gap: 6px; align-items: center; } .warn svg { width: 13px; height: 13px; }
.thinking { padding: 2px 16px 18px; }
.tsteps { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }
.tstep { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--label-3); transition: color .3s; }
.tstep i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); flex: none; transition: background .3s; }
.tstep i svg { width: 10px; height: 10px; color: #fff; opacity: 0; transition: opacity .2s; }
.tstep.run { color: var(--label); } .tstep.run i { background: transparent; border: 2px solid var(--blue); border-right-color: transparent; animation: spin .7s linear infinite; }
.tstep.done { color: var(--label-2); } .tstep.done i { background: var(--green); } .tstep.done i svg { opacity: 1; }
.thinking .skel { height: 11px; margin: 8px 0; }

/* tablo */
.tw { max-height: 400px; overflow: auto; }
table.grid { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.grid th { position: sticky; top: 0; z-index: 1; background: var(--win-2); text-align: left; font-weight: 600; font-size: 11.5px; color: var(--label-2); padding: 6px 12px; border-bottom: .5px solid var(--sep-2);
  cursor: default; white-space: nowrap; user-select: none; }
:root[data-theme="dark"] .grid th { background: #28282b; }
.grid th:hover { color: var(--label); } .grid th .ar { color: var(--blue); margin-left: 3px; }
.grid td { padding: 5px 12px; white-space: nowrap; }
.grid tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--fill) 45%, transparent); }
.grid tbody tr:hover td { background: var(--blue-soft); }
.grid .n { text-align: right; font-variant-numeric: tabular-nums; }
.grid .rn { color: var(--label-4); width: 30px; font-size: 11px; }
.grid .bb { display: inline-block; vertical-align: middle; width: 48px; height: 4px; border-radius: 2px; background: var(--fill); margin-left: 8px; overflow: hidden; }
.grid .bb i { display: block; height: 100%; background: var(--blue); border-radius: 2px; }

/* sql */
pre.sql { margin: 0; padding: 12px 14px; font: 12px/1.65 var(--mono); overflow-x: auto; white-space: pre; color: var(--label); background: var(--win-2); }
:root[data-theme="dark"] pre.sql { background: #18181a; }
pre.sql .k { color: #ad3da4; font-weight: 600; } pre.sql .f { color: #3e8087; } pre.sql .s { color: #c41a16; } pre.sql .q { color: #1c00cf; } pre.sql .d { color: #1c00cf; } pre.sql .c { color: #707f8c; }
:root[data-theme="dark"] pre.sql .k { color: #ff7ab2; } :root[data-theme="dark"] pre.sql .f { color: #67b7a4; } :root[data-theme="dark"] pre.sql .s { color: #ff8170; }
:root[data-theme="dark"] pre.sql .q, :root[data-theme="dark"] pre.sql .d { color: #d9c97c; }

/* grafikler */
.kpis { display: flex; gap: 12px; flex-wrap: wrap; }
.kpi { flex: 1; min-width: 200px; padding: 14px 16px; border-radius: 12px; background: var(--win-2); }
.kpi small { display: block; font-size: 12px; color: var(--label-2); font-weight: 600; }
.kpi b { display: block; font: 700 38px/1.1 var(--display); letter-spacing: -.03em; margin-top: 6px; font-variant-numeric: tabular-nums;
  background: linear-gradient(120deg, var(--blue), var(--indigo)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.hbars { display: grid; gap: 6px; }
.hb { display: grid; grid-template-columns: minmax(100px, 210px) 1fr auto; gap: 12px; align-items: center; font-size: 12.5px; }
.hb .l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--label-2); }
.hb .t { height: 18px; border-radius: 5px; background: var(--fill); overflow: hidden; position: relative; }
.hb .t i { position: absolute; inset: 0 auto 0 0; border-radius: 5px; background: linear-gradient(90deg, var(--c, var(--blue)), color-mix(in srgb, var(--c, var(--blue)) 70%, #fff)); transform-origin: left; animation: grow-x .9s var(--spring) both; }
.hb .v { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 86px; text-align: right; }
svg.plot { width: 100%; height: auto; display: block; overflow: visible; }
.plot .gl { stroke: var(--sep); } .plot .ax { fill: var(--label-3); font: 10.5px var(--font); }
.plot .ln { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s var(--ease) .1s forwards; }
.plot .ar { opacity: 0; animation: fade-to .8s ease .8s forwards; }
.plot .pt { fill: var(--card); stroke-width: 2; opacity: 0; animation: fade-to .3s ease forwards; }
.plot .hot { fill: transparent; }
.plot .vbar { transform-origin: bottom; transform-box: fill-box; animation: grow-y .8s var(--spring) both; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--label-2); } .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 50%; }
.donut { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
.donut svg { width: 160px; height: 160px; transform: rotate(-90deg); flex: none; }
.donut circle { fill: none; stroke-width: 6; } .donut .sg { animation: seg 1.1s var(--spring) both; }
@keyframes seg { from { stroke-dasharray: 0 100; } }
.donut .lg { display: grid; gap: 7px; flex: 1; min-width: 220px; }
.donut .lg div { display: grid; grid-template-columns: 10px 1fr auto 52px; gap: 10px; align-items: center; font-size: 12.5px; animation: rise .45s var(--spring) both; }
.donut .lg i { width: 9px; height: 9px; border-radius: 50%; } .donut .lg b { font-weight: 600; font-variant-numeric: tabular-nums; } .donut .lg small { color: var(--label-3); text-align: right; }
.tip { position: fixed; z-index: 99; pointer-events: none; padding: 6px 9px; border-radius: 7px; background: var(--tb); backdrop-filter: blur(20px); box-shadow: var(--pop-sh); font-size: 12px; opacity: 0; transition: opacity .12s; white-space: nowrap; }
.tip b { display: block; font-size: 11px; color: var(--label-3); font-weight: 600; }

/* ---------- Denetçi ---------- */
.insp { min-width: 0; overflow: hidden; background: var(--insp); border-left: .5px solid var(--sep-2); display: flex; flex-direction: column; }
.insp-h { height: 52px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: .5px solid var(--sep); }
.insp-h b { font-size: 13px; font-weight: 700; } .insp-h .seg { margin-left: auto; }
.insp-b { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0 20px; }
.insp-empty { padding: 60px 26px; text-align: center; color: var(--label-3); font-size: 12.5px; }
.insp-empty svg { width: 40px; height: 40px; color: var(--label-4); display: block; margin: 0 auto 10px; }
details.sec { border-bottom: .5px solid var(--sep); }
details.sec > summary { list-style: none; display: flex; align-items: center; gap: 6px; padding: 11px 14px 9px; font-size: 11.5px; font-weight: 700; color: var(--label-2); cursor: default; }
details.sec > summary::-webkit-details-marker { display: none; }
details.sec > summary svg { width: 10px; height: 10px; transition: transform .25s var(--spring); color: var(--label-3); }
details.sec[open] > summary svg { transform: rotate(90deg); }
details.sec > summary .n { margin-left: auto; font-weight: 500; color: var(--label-3); }
.sec-b { padding: 0 14px 14px; animation: rise .35s var(--spring); }
.iq { font-size: 14px; font-weight: 600; line-height: 1.35; }
.timeline { position: relative; display: grid; gap: 2px; }
.timeline::before { content: ""; position: absolute; left: 11px; top: 12px; bottom: 12px; width: 1.5px; background: var(--sep-2); }
.tl { position: relative; display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; padding: 4px 0; animation: rise .4s var(--spring) both; }
.tl i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--k); color: #fff; position: relative; z-index: 1; box-shadow: 0 0 0 3px var(--insp); }
.tl i svg { width: 12px; height: 12px; }
.tl small { display: block; font-size: 10.5px; color: var(--label-3); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.tl span { font-size: 12.5px; font-weight: 550; } .tl em { display: block; font-style: normal; font-size: 11px; color: var(--label-3); margin-top: 1px; }
.checks { display: grid; gap: 6px; }
.ck { display: flex; align-items: center; gap: 8px; font-size: 12.5px; animation: rise .35s var(--spring) both; }
.ck i { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--green); flex: none; }
.ck i svg { width: 9px; height: 9px; color: #fff; }
.ck.no i { background: var(--red); } .ck.na i { background: var(--fill-2); } .ck.na { color: var(--label-3); }
.ck small { margin-left: auto; color: var(--label-3); font-size: 11px; font-family: var(--mono); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.perf { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.perf div { padding: 9px 10px; border-radius: 8px; background: var(--fill); }
.perf small { display: block; font-size: 10.5px; color: var(--label-3); font-weight: 600; } .perf b { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.isql { border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 .5px var(--sep-2); }
.isql pre.sql { font-size: 11px; padding: 10px; max-height: 300px; }
.isql .row { display: flex; gap: 6px; padding: 7px; border-top: .5px solid var(--sep); background: var(--card); }
.fus { display: grid; gap: 4px; }
.fu { display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 9px; border: 0; border-radius: 7px; background: none; text-align: left; font-size: 12.5px; cursor: default; transition: background .12s; }
.fu:hover { background: var(--blue-soft); color: var(--blue); } .fu svg { width: 13px; height: 13px; color: var(--blue); flex: none; }
.expl { font-size: 12.5px; color: var(--label-2); padding: 9px 10px; border-radius: 8px; background: color-mix(in srgb, var(--purple) 9%, transparent); }
.att { margin-top: 8px; } .att .e { color: var(--red); font-size: 11.5px; margin-top: 4px; }

/* ---------- Spotlight ---------- */
.spot-wrap { position: fixed; inset: 0; z-index: 60; display: none; justify-content: center; align-items: flex-start; padding-top: 16vh; background: rgba(0, 0, 0, .08); }
.spot-wrap.open { display: flex; animation: fade .15s; }
.spot { width: min(680px, calc(100vw - 32px)); border-radius: 16px; background: var(--tb); backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); box-shadow: var(--pop-sh);
  overflow: hidden; animation: spot-in .35s var(--spring); }
:root[data-theme="dark"] .spot { background: rgba(42, 42, 46, .86); }
@keyframes spot-in { from { opacity: 0; transform: scale(.96) translateY(-8px); } }
.spot-in { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 58px; }
.spot-in > svg { width: 22px; height: 22px; color: var(--label-3); flex: none; }
.spot-in input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font-size: 21px; font-weight: 400; letter-spacing: -.01em; }
.spot-in input::placeholder { color: var(--label-3); }
.spot-in input.code { font: 15px var(--mono); }
.mini { width: 26px; height: 26px; flex: none; } .mini .needle { transform-origin: 64px 64px; }
.preview { padding: 0 16px 12px; display: flex; gap: 6px; flex-wrap: wrap; min-height: 0; }
.pv { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px 0 4px; border-radius: 99px; font-size: 12px; background: var(--card); box-shadow: 0 0 0 .5px var(--sep-2);
  animation: pop .3s var(--spring) both; }
.pv i { width: 16px; height: 16px; border-radius: 50%; background: var(--k); display: grid; place-items: center; } .pv i svg { width: 9px; height: 9px; color: #fff; }
.pv small { color: var(--label-3); font-size: 11px; } .pv.unk { color: var(--red); } .pv.unk i { background: var(--red); }
.pv.hint { background: none; box-shadow: none; color: var(--label-3); padding-left: 2px; }
.spot-list { max-height: 46vh; overflow-y: auto; border-top: .5px solid var(--sep); padding: 6px; }
.spot-h { font-size: 11px; font-weight: 700; color: var(--label-3); padding: 8px 10px 4px; }
.si { display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; font-size: 13.5px; cursor: default; }
.si .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; background: var(--k, var(--blue)); flex: none; } .si .ic svg { width: 13px; height: 13px; }
.si span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .si small { color: var(--label-3); font-size: 11.5px; }
.si.on { background: var(--sel); color: #fff; } .si.on small { color: rgba(255, 255, 255, .8); }
.spot-f { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: .5px solid var(--sep); font-size: 11.5px; color: var(--label-3); }
.spot-f .sp { flex: 1; }

/* ---------- panolar (widget'lar) ---------- */
.widgets { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
.wg { position: relative; padding: 14px 16px 16px; border-radius: 20px; background: var(--card); box-shadow: var(--card-sh), 0 12px 30px -16px rgba(0, 0, 0, .25); animation: pop .55s var(--spring) both;
  transition: transform .35s var(--spring); overflow: hidden; }
.wg:hover { transform: translateY(-3px); }
.wg.small { grid-column: span 1; }
.wg .wh { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.wg .wh .ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; background: var(--k, var(--blue)); flex: none; } .wg .wh .ico svg { width: 12px; height: 12px; }
.wg .wh b { flex: 1; font-size: 13px; font-weight: 650; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wg .wh .ib { opacity: 0; transition: opacity .15s; } .wg:hover .wh .ib { opacity: 1; }
.wg .kpi { background: none; padding: 4px 0; } .wg .kpi b { font-size: 40px; }
.wg .ws { margin: 10px 0 0; font-size: 12px; color: var(--label-2); }
.wg .ws b { color: var(--label); }
.wg .hb { grid-template-columns: minmax(70px, 130px) 1fr auto; } .wg .hb .v { min-width: 64px; }

/* ---------- şema tuvali ---------- */
.canvas { position: relative; border-radius: 14px; padding: 26px; background-color: var(--win-2);
  background-image: radial-gradient(var(--fill-2) 1px, transparent 1.2px); background-size: 18px 18px; box-shadow: inset 0 0 0 .5px var(--sep); }
.er { position: relative; display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 40px 34px; }
.er svg.links { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; z-index: 0; }
.er svg.links path { fill: none; stroke: var(--blue); stroke-width: 1.6; stroke-dasharray: 5 5; opacity: .65; animation: flow 1.1s linear infinite; }
.er svg.links circle { fill: var(--blue); }
@keyframes flow { to { stroke-dashoffset: -20; } }
.twin { position: relative; z-index: 1; border-radius: 10px; background: var(--card); box-shadow: var(--card-sh), 0 10px 24px -14px rgba(0, 0, 0, .3); overflow: hidden; animation: pop .5s var(--spring) both;
  transition: transform .3s var(--spring), box-shadow .2s; cursor: default; }
.twin:hover { transform: translateY(-2px); } .twin.on { box-shadow: 0 0 0 2px var(--blue), 0 10px 24px -14px rgba(0, 0, 0, .3); }
.twin .tt { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: var(--win-2); border-bottom: .5px solid var(--sep); }
.twin .tt .d { display: flex; gap: 4px; } .twin .tt .d i { width: 7px; height: 7px; border-radius: 50%; background: var(--fill-2); }
.twin .tt b { flex: 1; text-align: center; font: 600 12px var(--mono); } .twin .tt small { font-size: 10.5px; color: var(--label-3); }
.tcol { display: flex; align-items: center; gap: 7px; padding: 4px 10px; font: 11.5px var(--mono); }
.tcol:nth-child(even) { background: color-mix(in srgb, var(--fill) 40%, transparent); }
.tcol svg { width: 11px; height: 11px; flex: none; } .tcol .pk { color: var(--orange); } .tcol .fk { color: var(--blue); }
.tcol span { flex: 1; } .tcol small { color: var(--label-3); font-size: 10px; } .tcol.hl { background: var(--blue-soft) !important; }
.lay { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 22px; }
@media (max-width: 1200px) { .lay { grid-template-columns: 1fr; } }
.group { background: var(--card); border-radius: 12px; box-shadow: var(--card-sh); overflow: hidden; }
.group h3 { font-size: 13px; font-weight: 700; padding: 12px 14px 4px; display: flex; align-items: center; gap: 8px; } .group h3 svg { width: 15px; height: 15px; color: var(--blue); }
.group > p { margin: 0; padding: 0 14px 8px; font-size: 12px; color: var(--label-3); }
.row-i { padding: 9px 14px; border-top: .5px solid var(--sep); }
.row-i b { font-size: 13px; } .row-i p { margin: 1px 0 5px; font-size: 12px; color: var(--label-2); }
.row-i code { display: block; font: 11px/1.5 var(--mono); color: var(--purple); white-space: pre-wrap; word-break: break-word; }
.vals { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; } .vals span { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--fill); color: var(--label-2); }
.sample { margin-top: 20px; }

/* ---------- geçmiş, veri setleri ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { padding: 12px 14px; border-radius: 12px; background: var(--card); box-shadow: var(--card-sh); animation: pop .45s var(--spring) both; }
.stat small { display: block; font-size: 11.5px; color: var(--label-3); font-weight: 600; } .stat b { font: 700 24px var(--display); letter-spacing: -.02em; }
.hist td.q { white-space: normal; min-width: 240px; } .hist tr { cursor: default; }
.ok-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); } .ok-dot.no { background: var(--red); }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.file { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 10px 12px; border: 0; border-radius: 10px; background: none; cursor: default; text-align: center; animation: pop .45s var(--spring) both; }
.file:hover { background: var(--fill); } .file.on { background: var(--blue-soft); }
.file .doc { width: 58px; height: 72px; position: relative; filter: drop-shadow(0 4px 8px rgba(0, 0, 0, .15)); }
.file b { font-size: 12.5px; font-weight: 600; line-height: 1.25; } .file small { font-size: 11px; color: var(--label-3); }
.file .acts { display: flex; gap: 4px; margin-top: 2px; }
.file.on b { color: var(--blue); }
.drop { margin-top: 18px; border-radius: 14px; border: 2px dashed var(--sep-2); padding: 26px; text-align: center; cursor: default; transition: border-color .2s, background .2s; }
.drop:hover, .drop.over { border-color: var(--blue); background: var(--blue-soft); }
.drop svg { width: 30px; height: 30px; color: var(--blue); } .drop b { display: block; margin-top: 6px; font-size: 14px; } .drop small { color: var(--label-3); }
.notes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
.note { padding: 12px 14px; border-radius: 12px; background: var(--card); box-shadow: var(--card-sh); font-size: 12.5px; color: var(--label-2); }
.note b { display: block; color: var(--label); margin-bottom: 2px; }

/* ---------- sayfa (sheet), tercih penceresi, karşılama ---------- */
.scrim { position: fixed; inset: 0; z-index: 70; display: none; place-items: center; background: rgba(0, 0, 0, .18); }
.scrim.open { display: grid; animation: fade .2s; }
.pane-win { width: min(640px, calc(100vw - 32px)); border-radius: 12px; background: var(--win); box-shadow: var(--pop-sh); overflow: hidden; animation: pop .4s var(--spring); }
.pw-tb { display: flex; align-items: center; padding: 12px 14px 0; position: relative; }
.pw-tb h3 { position: absolute; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 700; pointer-events: none; }
.ptabs { display: flex; justify-content: center; gap: 4px; padding: 10px 0 8px; border-bottom: .5px solid var(--sep); background: var(--tb); }
.ptab { width: 76px; padding: 6px 4px; border: 0; border-radius: 8px; background: none; display: grid; justify-items: center; gap: 3px; font-size: 11.5px; color: var(--label-2); cursor: default; }
.ptab .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--k); }
.ptab .ic svg { width: 17px; height: 17px; } .ptab.on { background: var(--fill); color: var(--label); }
.pw-b { padding: 18px 24px 22px; max-height: 64vh; overflow-y: auto; }
.form { display: grid; grid-template-columns: 170px 1fr; gap: 14px 16px; align-items: center; }
.form > label { text-align: right; font-size: 13px; color: var(--label-2); }
.form code { font: 12px var(--mono); }
pre.term { margin: 0; padding: 12px 14px; border-radius: 10px; background: #1e1e1e; color: #e5e5e5; font: 12px/1.7 var(--mono); overflow-x: auto; }
pre.term .c { color: #7f8c98; }
.how { display: grid; gap: 10px; }
.how div { display: grid; grid-template-columns: 30px 1fr; gap: 10px; }
.how i { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: #fff; background: var(--k); } .how i svg { width: 15px; height: 15px; }
.how b { display: block; font-size: 13px; } .how p { margin: 0; font-size: 12.5px; color: var(--label-2); }
.about { text-align: center; padding: 6px 0; } .about h2 { font-size: 22px; margin-top: 10px; } .about p { color: var(--label-2); font-size: 12.5px; margin: 4px 0; }
.onb { width: min(520px, calc(100vw - 32px)); padding: 34px 40px 26px; text-align: center; }
.onb h2 { font-size: 26px; font-weight: 700; margin: 16px 0 22px; letter-spacing: -.02em; }
.feat { display: grid; grid-template-columns: 40px 1fr; gap: 14px; text-align: left; margin-bottom: 18px; animation: rise .5s var(--spring) both; }
.feat i { width: 40px; height: 40px; display: grid; place-items: center; color: var(--k); } .feat i svg { width: 30px; height: 30px; }
.feat b { display: block; font-size: 13.5px; } .feat span { font-size: 12.5px; color: var(--label-2); }
.onb .row { display: flex; justify-content: center; gap: 10px; margin-top: 24px; }
.sheet-wrap { position: absolute; inset: 52px 0 0 0; z-index: 20; display: none; justify-content: center; background: rgba(0, 0, 0, .12); }
.sheet-wrap.open { display: flex; animation: fade .2s; }
.sheet { width: min(720px, calc(100% - 40px)); align-self: flex-start; border-radius: 0 0 12px 12px; background: var(--win); box-shadow: var(--pop-sh); padding: 18px 20px; animation: sheet-in .4s var(--spring); }
@keyframes sheet-in { from { transform: translateY(-100%); } }
.sheet h3 { font-size: 15px; } .sheet p { margin: 4px 0 12px; color: var(--label-2); font-size: 12.5px; }
.sheet textarea { width: 100%; min-height: 220px; border: 0; border-radius: 8px; padding: 12px; font: 12.5px/1.6 var(--mono); background: var(--win-2); box-shadow: inset 0 0 0 .5px var(--sep-2); outline: 0; resize: vertical; }
.sheet textarea:focus { box-shadow: inset 0 0 0 .5px var(--sep-2), 0 0 0 3px var(--blue-soft); }
.sheet .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; align-items: center; } .sheet .row small { margin-right: auto; color: var(--label-3); display: flex; gap: 6px; align-items: center; }
.sheet .row small svg { width: 13px; height: 13px; color: var(--green); }

/* bildirim (toast) */
.notif { position: fixed; top: 38px; right: 14px; z-index: 95; width: 340px; display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--tb);
  backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8); box-shadow: var(--pop-sh); transform: translateX(380px); transition: transform .5s var(--spring); }
:root[data-theme="dark"] .notif { background: rgba(50, 50, 54, .86); }
.notif.show { transform: none; }
.notif svg.app { width: 34px; height: 34px; flex: none; }
.notif b { display: block; font-size: 12.5px; } .notif span { font-size: 12.5px; color: var(--label-2); }
.dropzone { position: fixed; inset: 0; z-index: 92; display: grid; place-items: center; background: rgba(0, 122, 255, .12); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity .2s; }
.dropzone.on { opacity: 1; }
.dropzone div { padding: 36px 54px; border-radius: 18px; background: var(--win); box-shadow: var(--pop-sh); text-align: center; border: 2px dashed var(--blue); }
.dropzone svg { width: 36px; height: 36px; color: var(--blue); } .dropzone b { display: block; font-size: 18px; margin-top: 8px; }

/* ---------- küçük ekranlar ---------- */
@media (max-width: 1100px) {
  .win, .win.no-sb { grid-template-columns: 0 minmax(0, 1fr) 0; }
  .win.insp-float .insp { position: absolute; right: 8px; top: 60px; bottom: 8px; width: 300px; border-radius: 12px; box-shadow: var(--pop-sh); z-index: 15; border: 0; }
  .win.sb-float .sb { position: absolute; left: 0; top: 0; bottom: 0; width: 240px; z-index: 16; box-shadow: var(--pop-sh); background: var(--tb); }
}
@media (max-width: 760px) {
  .win { top: 0; width: 100vw; height: 100vh; height: 100dvh; border-radius: 0; animation: none; }
  .tb .title small, .search span, .tb .seg { display: none; } .search { width: 36px; padding: 0 9px; } .search kbd { display: none; }
  .view { padding: 16px 14px 30px; }
  .stats { grid-template-columns: 1fr 1fr; }
  .form { grid-template-columns: 1fr; } .form > label { text-align: left; }
  .hb { grid-template-columns: minmax(80px, 120px) 1fr auto; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .plot .ln { stroke-dashoffset: 0; } .plot .ar, .plot .pt { opacity: 1; }
}

/* ---------- canlı anlam vurgusu: sözcükler ne olarak anlaşıldıysa o renkte altı çizilir ---------- */
.sq-wrap { position: relative; flex: 1; min-width: 0; display: flex; }
.sq-wrap input { position: relative; z-index: 1; width: 100%; background: transparent !important; }
.sq-hl { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; white-space: pre; color: transparent;
  font-size: 21px; font-weight: 400; letter-spacing: -.01em; display: flex; align-items: center; }
.sq-hl > span { display: inline-block; white-space: pre; }
.tk { border-radius: 4px; background: color-mix(in srgb, var(--k) 13%, transparent); box-shadow: inset 0 -2.5px 0 var(--k); transition: background .25s, box-shadow .25s;
  animation: tk-in .35s var(--ease); }
.tk.unknown { background: none; box-shadow: none; text-decoration: wavy underline var(--red); text-decoration-thickness: 1.5px; text-underline-offset: 6px; color: transparent; }
@keyframes tk-in { from { box-shadow: inset 0 0 0 var(--k); background: transparent; } }
.ch .q h3 .tk { color: inherit; background: color-mix(in srgb, var(--k) 10%, transparent); box-shadow: inset 0 -2px 0 color-mix(in srgb, var(--k) 70%, transparent); animation: none; padding: 0 1px; }
.ch .q h3 .tk.unknown { color: inherit; text-underline-offset: 4px; box-shadow: none; background: none; }
.legend-k { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 14px; font-size: 11.5px; color: var(--label-3); justify-content: center; }
.legend-k span { display: inline-flex; align-items: center; gap: 5px; } .legend-k i { width: 14px; height: 3px; border-radius: 2px; background: var(--k); }


/* =====================================================================
   KEŞİF TEMASI — sıvı cam (liquid glass) paneller, topoğrafik harita
   ===================================================================== */
:root {
  --blue: #1668d6; --blue-soft: rgba(22, 104, 214, .12); --sel: #1668d6; --teal: #0f9fae; --brass: #c7862a; --ocean: #0b2f4f;
  --glass: rgba(255, 255, 255, .52); --glass-2: rgba(255, 255, 255, .7); --glass-solid: #f7f9fb;
  --rim: rgba(255, 255, 255, .75); --rim-2: rgba(255, 255, 255, .15);
  --glass-sh: 0 0 0 .5px rgba(16, 42, 66, .14), 0 18px 50px -18px rgba(16, 42, 66, .32), 0 2px 6px -2px rgba(16, 42, 66, .08);
  --card: rgba(255, 255, 255, .78); --card-sh: 0 0 0 .5px rgba(16, 42, 66, .1), 0 1px 2px rgba(16, 42, 66, .05), 0 10px 30px -18px rgba(16, 42, 66, .25);
  --win: #ffffff; --win-2: rgba(240, 244, 248, .8); --insp: transparent; --sb-sel: rgba(16, 42, 66, .07);
  --paper-1: #e8eff3; --paper-2: #f3efe6; --topo: rgba(18, 74, 96, .17); --topo-m: rgba(18, 74, 96, .3); --grid: rgba(18, 74, 96, .09); --lbl: rgba(18, 74, 96, .4);
  --au1: rgba(40, 190, 200, .45); --au2: rgba(255, 186, 96, .4); --au3: rgba(96, 140, 255, .38);
  --pop-sh: 0 0 0 .5px rgba(16, 42, 66, .16), 0 30px 80px -20px rgba(16, 42, 66, .45);
}
:root[data-theme="dark"] {
  --blue: #3d8bff; --blue-soft: rgba(61, 139, 255, .18); --sel: #2f7df0; --teal: #3cc8d6; --brass: #e7a84a;
  --glass: rgba(16, 24, 38, .5); --glass-2: rgba(18, 26, 40, .72); --glass-solid: #121a28;
  --rim: rgba(255, 255, 255, .22); --rim-2: rgba(255, 255, 255, .04);
  --glass-sh: 0 0 0 .5px rgba(0, 0, 0, .5), 0 22px 60px -18px rgba(0, 0, 0, .7);
  --card: rgba(36, 46, 64, .55); --card-sh: 0 0 0 .5px rgba(255, 255, 255, .08), 0 10px 30px -18px rgba(0, 0, 0, .6);
  --win: #1a2232; --win-2: rgba(10, 16, 26, .55); --sb-sel: rgba(255, 255, 255, .08);
  --paper-1: #06101c; --paper-2: #0b1a2c; --topo: rgba(110, 215, 225, .12); --topo-m: rgba(110, 215, 225, .24); --grid: rgba(140, 200, 230, .07); --lbl: rgba(140, 210, 230, .35);
  --au1: rgba(20, 160, 175, .32); --au2: rgba(231, 168, 74, .14); --au3: rgba(80, 90, 230, .3);
  --pop-sh: 0 0 0 .5px rgba(255, 255, 255, .1), 0 30px 80px -20px rgba(0, 0, 0, .8);
}
body { background: var(--paper-1); }
.desk { background: linear-gradient(160deg, var(--paper-1), var(--paper-2)); }

/* harita */
.aurora { position: absolute; inset: -10%; filter: blur(60px); }
.aurora i { position: absolute; border-radius: 50%; animation: drift 34s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { width: 46vw; height: 46vw; left: 2%; top: 4%; background: var(--au1); }
.aurora i:nth-child(2) { width: 38vw; height: 38vw; right: 4%; top: 30%; background: var(--au2); animation-duration: 42s; animation-delay: -12s; }
.aurora i:nth-child(3) { width: 50vw; height: 40vw; left: 30%; bottom: -6%; background: var(--au3); animation-duration: 38s; animation-delay: -20s; }
@keyframes drift { 50% { transform: translate(6vw, 4vh) scale(1.1); } 100% { transform: translate(-4vw, 6vh) scale(.95); } }
.wall { animation: pan 90s ease-in-out infinite alternate; transform-origin: 50% 50%; }
@keyframes pan { to { transform: scale(1.06) translate(-1.2%, .8%); } }
.wall .c { fill: none; stroke: var(--topo); stroke-width: 1; }
.wall .cm { fill: none; stroke: var(--topo-m); stroke-width: 1.4; }
.wall .gr { fill: none; stroke: var(--grid); stroke-width: 1; stroke-dasharray: 2 6; }
.wall .lb text { fill: var(--lbl); font: 600 11px var(--mono); letter-spacing: .04em; }
.wall .route { fill: none; stroke: var(--brass); stroke-width: 2; stroke-dasharray: 2 9; stroke-linecap: round; opacity: .75; animation: march 3s linear infinite; }
@keyframes march { to { stroke-dashoffset: -44; } }
.wall .wp { fill: var(--glass-solid); stroke: var(--brass); stroke-width: 2; }
.wall .trav { fill: var(--brass); filter: drop-shadow(0 0 6px var(--brass)); }
.wall .dest path { stroke: var(--brass); stroke-width: 3; stroke-linecap: round; }
.wall .dest .ping { fill: none; stroke: var(--brass); stroke-width: 1.5; animation: ping 2.6s ease-out infinite; transform-origin: center; transform-box: fill-box; }
@keyframes ping { from { opacity: .8; transform: scale(.4); } to { opacity: 0; transform: scale(2.2); } }

/* sıvı cam yüzeyi: yarı saydam dolgu, bulanıklık, kenarda ışık yansıması */
.sb, .mp, .insp, .tb, .spot, .pane-win, .notif, .sheet, .dropzone div, .tip {
  background: var(--glass); backdrop-filter: blur(28px) saturate(1.7); -webkit-backdrop-filter: blur(28px) saturate(1.7); box-shadow: var(--glass-sh); }
.sb::before, .mp::before, .insp::before, .tb::before, .spot::before, .pane-win::before, .notif::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 5;
  background: linear-gradient(150deg, var(--rim), var(--rim-2) 32%, transparent 55%, var(--rim-2) 78%, var(--rim));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.spot, .pane-win { position: relative; }
.win { animation: win-in .7s var(--spring) backwards; }
.desk { overflow: clip; }

/* yerleşim: harita üzerinde üç yüzen panel */
.win { top: 14px; height: calc(100vh - 28px); height: calc(100dvh - 28px); width: calc(100vw - 28px); max-width: 1640px; border-radius: 0; background: none; box-shadow: none; overflow: visible;
  grid-template-columns: 244px 14px minmax(0, 1fr) 14px 320px; }
.win > .sb { grid-column: 1; } .win > .mp { grid-column: 3; } .win > .insp { grid-column: 5; }
.win.no-sb { grid-template-columns: 0 0 minmax(0, 1fr) 14px 320px; }
.win.no-insp { grid-template-columns: 244px 14px minmax(0, 1fr) 0 0; }
.win.no-sb.no-insp { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
@keyframes win-in { from { opacity: 0; transform: translateX(-50%) translateY(14px) scale(.985); } }
.sb, .mp, .insp { position: relative; border-radius: 24px; overflow: hidden; border: 0; transition: opacity .3s; }
.win.no-sb .sb, .win.no-insp .insp { opacity: 0; pointer-events: none; }
.mp { background: var(--glass-2); }

/* marka */
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 8px; flex: none; }
.brand .mark { width: 34px; height: 34px; filter: drop-shadow(0 4px 10px rgba(11, 47, 79, .35)); }
.brand b { display: block; font: 700 17px/1.1 var(--display); letter-spacing: -.02em; }
.brand small { display: block; font: 600 10px var(--mono); color: var(--label-3); letter-spacing: .08em; text-transform: uppercase; margin-top: 2px; }
.sb-i { border-radius: 10px; height: 30px; }
.sb-i.on { background: var(--glass-2); box-shadow: 0 0 0 .5px rgba(16, 42, 66, .08), 0 2px 8px -3px rgba(16, 42, 66, .2); }
:root[data-theme="dark"] .sb-i.on { background: rgba(255, 255, 255, .1); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08); }
.sb-i svg { color: var(--teal); } .sb-i.on svg { color: var(--blue); }
.sb-foot { border-top: 0; }
.ds { background: var(--card); box-shadow: var(--card-sh); border-radius: 14px; padding: 8px; }
.ds .ico { border-radius: 9px; background: linear-gradient(150deg, #1b8a9a, var(--ocean)); }

/* üst çubuk: yüzen kapsül */
.tb { margin: 10px 10px 0; height: 50px; border-radius: 18px; border-bottom: 0; background: var(--glass); }
.search { border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 .5px rgba(16, 42, 66, .08); }
.seg { border-radius: 11px; } .seg .thumb { border-radius: 9px; } .seg button { border-radius: 9px; }
.tbtn { border-radius: 10px; }
.view { padding-top: 22px; }
.sheet-wrap { inset: 70px 0 0 0; background: none; }
.sheet { border-radius: 20px; margin-top: 6px; }

/* karşılama: pusula gülü */
.rose { color: var(--ocean); display: block; overflow: visible; }
:root[data-theme="dark"] .rose { color: #bfe9f0; }
.rose .bezel { transform-origin: 100px 100px; animation: bezel 80s linear infinite; }
@keyframes bezel { to { transform: rotate(360deg); } }
.rose .needle { transform-origin: 100px 100px; animation: settle 2s var(--spring) .2s both; }
.busy .rose .needle { animation: seek 1.1s ease-in-out infinite alternate; }
@keyframes seek { from { transform: rotate(-35deg); } to { transform: rotate(35deg); } }
.rose.hero { width: 132px; height: 132px; margin: 0 auto; animation: pop .8s var(--spring) both; filter: drop-shadow(0 12px 24px rgba(11, 47, 79, .18)); }
.home { margin-top: 5vh; }
.home h1 { font-size: 34px; letter-spacing: -.03em; }
.bigsearch { border-radius: 20px; height: 56px; background: var(--card); backdrop-filter: blur(20px); box-shadow: var(--card-sh), 0 0 0 4px rgba(255, 255, 255, .25), 0 20px 40px -20px rgba(11, 47, 79, .45); }
.tiles-h { color: var(--label-3); text-transform: uppercase; font: 700 11px var(--mono); letter-spacing: .08em; }
.tile { color: var(--label); background: var(--card); box-shadow: var(--card-sh); border-radius: 18px; min-height: 104px; padding: 14px; gap: 12px; }
.tile::after { display: none; }
.tile i { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, var(--a), var(--b)); box-shadow: 0 4px 10px -4px var(--b); }
.tile i svg { width: 16px; height: 16px; }
.tile b { text-shadow: none; font-weight: 600; padding-right: 18px; }
.tile .go { position: absolute; right: 12px; bottom: 12px; color: var(--label-4); transition: transform .3s var(--spring), color .2s; } .tile .go svg { width: 15px; height: 15px; }
.tile:hover { box-shadow: var(--card-sh), 0 18px 30px -18px var(--b); } .tile:hover .go { transform: translateX(3px); color: var(--blue); }

/* cevap kartları */
.cell { border-radius: 20px; backdrop-filter: blur(12px); }
.cell.sel { box-shadow: 0 0 0 1.5px var(--blue), 0 0 0 6px var(--blue-soft), 0 16px 34px -20px rgba(11, 47, 79, .5); }
.tabs { border-top-color: var(--sep); }
.tabs .seg, .vh .seg { background: var(--fill); }
.kpi { background: var(--win-2); border-radius: 16px; }
.kpi b { background: linear-gradient(120deg, var(--blue), var(--teal)); -webkit-background-clip: text; background-clip: text; }
.grid th { background: var(--glass-solid); }
.btn { border-radius: 10px; background: var(--card); }
:root[data-theme="dark"] .btn { background: rgba(255, 255, 255, .1); }
.btn.pri { background: linear-gradient(150deg, #1b8fd8, var(--blue)); }
.chipq { background: var(--card); box-shadow: 0 0 0 .5px var(--sep-2); }
.wg, .group, .stat, .note, .twin { border-radius: 20px; }
.canvas { background-color: transparent; border-radius: 20px; }

/* seyir defteri: rota çizgisi */
.insp-h { border-bottom: 0; height: 56px; padding: 0 18px; }
.insp-h b { font: 700 15px var(--display); letter-spacing: -.01em; }
details.sec { border-bottom: 0; margin: 0 10px 8px; border-radius: 16px; background: var(--card); box-shadow: var(--card-sh); }
details.sec > summary { padding: 11px 14px 9px; }
.timeline::before { width: 0; background: none; border-left: 2px dashed color-mix(in srgb, var(--brass) 70%, transparent); left: 11px; }
.tl i { box-shadow: 0 0 0 3px var(--glass-solid), 0 3px 8px -2px var(--k); }
:root[data-theme="dark"] .tl i { box-shadow: 0 0 0 3px #253247, 0 3px 8px -2px var(--k); }
.tl:last-child::after { content: ""; position: absolute; left: 7px; bottom: -8px; width: 10px; height: 10px; border-radius: 50%; background: var(--brass); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brass) 25%, transparent); }
.perf div { background: var(--win-2); border-radius: 12px; }
.isql { border-radius: 12px; }
.insp-empty .rose { width: 92px; height: 92px; margin: 0 auto 14px; opacity: .85; }

/* pusula (komut paleti) */
.spot-wrap { background: rgba(8, 24, 40, .14); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
.spot { border-radius: 26px; background: var(--glass-2); overflow: hidden; }
:root[data-theme="dark"] .spot { background: rgba(18, 26, 40, .78); }
.spot-in { height: 64px; padding: 0 18px; }
.mini { width: 32px; height: 32px; }
.mini .bezel { animation-duration: 30s; }
.spot-list { border-top-color: var(--sep); padding: 8px; }
.si { border-radius: 12px; } .si .ic { border-radius: 8px; }
.si.on { background: linear-gradient(150deg, #1b8fd8, var(--blue)); }
.pv { background: var(--card); }

/* tercihler, karşılama, bildirim */
.scrim { background: rgba(8, 24, 40, .2); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.pane-win { border-radius: 26px; background: var(--glass-2); }
:root[data-theme="dark"] .pane-win { background: rgba(18, 26, 40, .82); }
.pw-tb { padding: 16px 16px 4px 22px; justify-content: space-between; }
.pw-tb h3 { position: static; text-align: left; font-size: 15px; }
.xbtn { width: 28px; height: 28px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--fill); color: var(--label-2); cursor: default; transition: background .15s, transform .2s var(--spring); }
.xbtn:hover { background: var(--fill-2); transform: rotate(90deg); } .xbtn svg { width: 13px; height: 13px; }
.ptabs { background: none; border-bottom: 0; padding: 6px 16px 10px; }
.ptab { border-radius: 14px; } .ptab.on { background: var(--card); box-shadow: var(--card-sh); }
.ptab .ic { border-radius: 10px; }
.onb-rose { width: 110px; height: 110px; margin: 0 auto; }
.onb { padding-top: 30px; }
.notif { top: 20px; right: 20px; border-radius: 20px; }
.notif svg.app { width: 32px; height: 32px; }
.dropzone div { border-radius: 26px; }

@media (max-width: 1100px) {
  .win, .win.no-sb, .win.no-insp, .win.no-sb.no-insp { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
  .win.no-sb .sb, .win.no-insp .insp { opacity: 1; }
  .win.sb-float .sb { position: absolute; left: 0; top: 0; bottom: 0; width: 250px; z-index: 16; box-shadow: var(--pop-sh); background: var(--glass-2); }
  .win.insp-float .insp { position: absolute; right: 0; left: auto; top: 0; bottom: 0; width: 320px; z-index: 15; box-shadow: var(--pop-sh); background: var(--glass-2); }
  .win:not(.sb-float) .sb, .win:not(.insp-float) .insp { visibility: hidden; }
}
@media (max-width: 760px) {
  .win { top: 0; width: 100vw; height: 100vh; height: 100dvh; }
  .mp { border-radius: 0; }
  .win.sb-float .sb, .win.insp-float .insp { border-radius: 0 24px 24px 0; }
  .win.insp-float .insp { border-radius: 24px 0 0 24px; width: min(320px, 88vw); }
  .rose.hero { width: 100px; height: 100px; } .home h1 { font-size: 26px; }
}

/* =====================================================================
   KATMANLAR — Atlas (açık harita) · Keşif (yolculuk) · sayfalar
   Üstte yüzen bir cam rıhtım (dock) katmanlar arasında gezdirir.
   ===================================================================== */
.map { position: absolute; inset: 0; transition: transform 1.4s var(--spring), filter 1.2s ease; transform-origin: 50% 40%; }
body:not([data-view="atlas"]) .map { transform: scale(1.14); }
body[data-view="schema"] .map { transform: scale(1.05); }
.dock, .answer, .pg, .glass-card { background: var(--glass); backdrop-filter: blur(28px) saturate(1.7); -webkit-backdrop-filter: blur(28px) saturate(1.7); box-shadow: var(--glass-sh); position: relative; }
.dock::before, .answer::before, .pg::before, .glass-card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none; z-index: 5;
  background: linear-gradient(150deg, var(--rim), var(--rim-2) 32%, transparent 55%, var(--rim-2) 78%, var(--rim));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.kick { display: block; font: 700 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--brass); }

/* rıhtım */
.dock { position: fixed; z-index: 40; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; height: 58px; padding: 0 8px 0 10px; border-radius: 22px;
  animation: dock-in .8s var(--spring) both; max-width: calc(100vw - 20px); }
@keyframes dock-in { from { opacity: 0; transform: translateX(-50%) translateY(-24px) scale(.96); } }
.dock .brand { display: flex; align-items: center; gap: 8px; padding: 0 12px 0 4px; height: 44px; border: 0; background: none; cursor: default; border-right: .5px solid var(--sep-2); margin-right: 4px; }
.dock .brand .mark { width: 32px; height: 32px; filter: drop-shadow(0 3px 8px rgba(11, 47, 79, .3)); }
.dock .brand b { font: 700 16px var(--display); letter-spacing: -.02em; }
.nav { position: relative; display: flex; gap: 2px; padding: 4px; border-radius: 16px; }
.nav .thumb { position: absolute; top: 4px; height: 38px; border-radius: 13px; background: var(--glass-solid); opacity: 0;
  box-shadow: 0 0 0 .5px rgba(16, 42, 66, .1), 0 4px 14px -6px rgba(16, 42, 66, .35), inset 0 1px 0 rgba(255, 255, 255, .9); transition: left .45s var(--spring), width .45s var(--spring); }
:root[data-theme="dark"] .nav .thumb { background: rgba(255, 255, 255, .12); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 4px 14px -6px rgba(0, 0, 0, .6); }
.nav button { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 7px; height: 38px; padding: 0 13px; border: 0; background: none; border-radius: 13px; cursor: default;
  color: var(--label-2); font-size: 13px; font-weight: 550; white-space: nowrap; transition: color .2s; }
.nav button:hover { color: var(--label); }
.nav button svg { width: 16px; height: 16px; } .nav button.on { color: var(--label); } .nav button.on svg { color: var(--blue); }
.nav button em { font-style: normal; font: 600 10.5px var(--mono); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; background: var(--fill); color: var(--label-2); }
.nav button em:empty { display: none; }
.dock-r { display: flex; align-items: center; gap: 4px; padding-left: 8px; margin-left: 4px; border-left: .5px solid var(--sep-2); }
.dsc { display: inline-flex; align-items: center; gap: 7px; height: 34px; max-width: 210px; padding: 0 12px; border: 0; border-radius: 12px; background: var(--card); box-shadow: inset 0 0 0 .5px var(--sep); cursor: default; font-size: 12.5px; font-weight: 550; }
.dsc span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* sahne */
.stage { position: fixed; inset: 86px 14px 14px; z-index: 3; }
.stage > .view { padding: 0; overflow: hidden; }
.view.on { animation: layer-in .55s var(--spring); }
@keyframes layer-in { from { opacity: 0; transform: translateY(14px) scale(.985); filter: blur(4px); } }
.sheet-wrap { inset: 0; z-index: 30; }

/* ATLAS: açık harita */
#v-atlas { overflow-y: auto !important; }
.atlas { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; max-width: 1240px; margin: 0 auto; padding: 4vh 8px 30px; align-items: start; }
.hero-col { text-align: center; }
.hero-col h1 { font-size: 40px; font-weight: 750; letter-spacing: -.035em; margin: 18px 0 8px; animation: rise .6s var(--spring) .1s both; }
.hero-col > p { color: var(--label-2); font-size: 15px; max-width: 560px; margin: 0 auto; animation: rise .6s var(--spring) .15s both; }
.hero-col .tiles { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.hero-col .tiles-h { justify-content: center; margin-top: 38px; }
.side-col { display: grid; gap: 16px; padding-top: 30px; }
.glass-card { border-radius: 22px; padding: 16px; animation: rise .6s var(--spring) .3s both; }
.lg-ds { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; padding: 8px; border: 0; border-radius: 14px; background: var(--card); box-shadow: var(--card-sh); text-align: left; cursor: default; }
.lg-ds .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: #fff; background: linear-gradient(150deg, #1b8a9a, var(--ocean)); flex: none; } .lg-ds .ico svg { width: 17px; height: 17px; }
.lg-ds b { display: block; font-size: 13px; } .lg-ds small { display: block; font-size: 11.5px; color: var(--label-3); }
.lg-llm { display: flex; align-items: center; gap: 7px; margin-top: 10px; font-size: 12px; color: var(--label-2); cursor: default; padding: 0 4px; }
.lg-tb { display: grid; gap: 2px; margin-top: 6px; }
.lg-tb button { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border: 0; border-radius: 9px; background: none; font: 12px var(--mono); cursor: default; text-align: left; }
.lg-tb button::before { content: ""; width: 8px; height: 8px; border-radius: 2px; border: 1.5px solid var(--teal); transform: rotate(45deg); flex: none; }
.lg-tb button:hover { background: var(--sb-sel); } .lg-tb span { flex: 1; } .lg-tb em { font-style: normal; color: var(--label-3); font-size: 11px; }
.recent-card { display: grid; gap: 2px; }
.rc { display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; border-radius: 12px; background: none; text-align: left; font-size: 12.5px; cursor: default; }
.rc:hover { background: var(--sb-sel); } .rc span:nth-child(2) { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rc svg { width: 13px; height: 13px; color: var(--label-4); flex: none; } .rc:hover svg { color: var(--blue); }
.rc .no, .stop .pin { font: 700 10.5px var(--mono); color: var(--brass); }
.rc.all { color: var(--blue); font-weight: 600; justify-content: space-between; } .rc:first-of-type { margin-top: 8px; }

/* KEŞİF: yolculuk rotası + cevap + seyir defteri */
.exp { height: 100%; display: grid; grid-template-columns: 268px minmax(0, 1fr) 340px; gap: 16px; transition: grid-template-columns .5s var(--spring); }
.exp.no-insp { grid-template-columns: 268px minmax(0, 1fr) 0; }
.exp.no-insp .insp { opacity: 0; pointer-events: none; }
.exp .insp { border-radius: 24px; display: flex; flex-direction: column; min-width: 0; }
.insp-h { gap: 9px; } .insp-h > svg { width: 18px; height: 18px; color: var(--brass); }
.insp-h .sp { flex: 1; } #inspClose { display: none; }
.rail { min-height: 0; overflow-y: auto; padding: 4px 4px 20px; }
.rail-h { display: flex; align-items: center; padding: 6px 6px 10px 10px; }
.rail-h b { font: 700 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--label-2); }
.rail-h .sp { flex: 1; } .rail-h .ib:disabled { opacity: .3; }
.stops { position: relative; display: grid; gap: 4px; margin-top: 6px; }
.stops::before { content: ""; position: absolute; left: 25px; top: 18px; bottom: 18px; border-left: 2px dashed color-mix(in srgb, var(--brass) 55%, transparent); }
.stop { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 10px 7px 8px; border: 0; border-radius: 16px; background: none; text-align: left; cursor: default;
  transition: background .2s, box-shadow .2s, transform .3s var(--spring); animation: rise .45s var(--spring) both; }
.stop .pin { width: 36px; height: 36px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--glass-solid); position: relative; z-index: 1;
  box-shadow: 0 0 0 .5px var(--sep-2), 0 4px 10px -4px rgba(16, 42, 66, .3); transition: background .25s, color .25s, transform .35s var(--spring); }
.stop .pin svg { width: 15px; height: 15px; }
.stop .tx { min-width: 0; flex: 1; } .stop b { display: block; font-size: 12.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stop small { display: block; font-size: 11px; color: var(--label-3); margin-top: 2px; }
.stop:hover { background: color-mix(in srgb, var(--glass-solid) 55%, transparent); }
.stop.on { background: var(--glass-2); box-shadow: var(--card-sh); backdrop-filter: blur(16px); }
.stop.on .pin { background: linear-gradient(150deg, #f2b45a, var(--brass)); color: #fff; transform: scale(1.06); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brass) 22%, transparent), 0 6px 14px -4px var(--brass); }
.stop.bad .pin { color: var(--red); } .stop.run .pin { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--brass) 18%, transparent); } }
.stop.new { margin-bottom: 4px; } .stop.new .pin { color: var(--blue); } .stop.new > span:nth-child(2) { flex: 1; font-weight: 600; font-size: 13px; color: var(--blue); }
.stop.new kbd { opacity: .8; }
.answer { border-radius: 24px; background: var(--glass-2); display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
.exp-tb { display: flex; align-items: center; gap: 6px; height: 58px; flex: none; padding: 0 12px; border-bottom: .5px solid var(--sep); }
.exp-tb b { font: 600 12px var(--mono); color: var(--label-2); letter-spacing: .04em; min-width: 92px; text-align: center; }
.exp-tb .ib:disabled { opacity: .3; } .exp-tb .sp { flex: 1; }
#inspToggle.on { color: var(--brass); }
#cells { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 24px 40px; max-width: none; width: 100%; margin: 0; display: block; }
#cells .cell { max-width: 1000px; margin: 0 auto; }
#cells .cell.sel { box-shadow: var(--card-sh); }
#cells .cell .ch h3 { font-size: 21px; letter-spacing: -.015em; }
.exp-empty { text-align: center; padding: 12vh 20px; color: var(--label-2); }
.exp-empty .rose { width: 110px; height: 110px; margin: 0 auto 16px; }
.exp-empty .btn { margin-top: 14px; }

/* SAYFALAR */
.view.page { overflow-y: auto !important; }
.pg { max-width: 1180px; margin: 0 auto 20px; border-radius: 26px; padding: 26px 30px 34px; background: var(--glass-2); }
.pg .vh h1 { font-size: 30px; letter-spacing: -.03em; margin-top: 4px; }
.open-map .pg { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; box-shadow: none; max-width: 1320px; }
.open-map .pg::before { display: none; }
.open-map .vh { display: inline-flex; padding: 16px 22px; border-radius: 22px; background: var(--glass-2); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--glass-sh); }
.open-map .canvas { background: none; box-shadow: none; padding: 30px 6px; }
.open-map .twin { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
.open-map .er svg.links path { stroke: var(--brass); opacity: .9; stroke-width: 2; } .open-map .er svg.links circle { fill: var(--brass); }
.open-map .group, .open-map .sample .group { backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

@media (max-width: 1180px) {
  .exp, .exp.no-insp { grid-template-columns: 240px minmax(0, 1fr) 0; }
  .exp .insp { position: absolute; right: 0; top: 0; bottom: 0; width: min(360px, 92vw); z-index: 25; background: var(--glass-2); box-shadow: var(--pop-sh);
    transform: translateX(calc(100% + 20px)); transition: transform .5s var(--spring); opacity: 1 !important; pointer-events: auto !important; }
  .exp.drawer .insp { transform: none; }
  #inspClose { display: grid; }
  .atlas { grid-template-columns: 1fr; } .side-col { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); padding-top: 0; }
  .nav button span { display: none; } .nav button { padding: 0 11px; }
}
@media (max-width: 760px) {

  .dock .brand b, .dsc { display: none; } .dock .brand { padding-right: 6px; }
  .nav { flex: 1; overflow-x: auto; scrollbar-width: none; } .nav button { padding: 0 10px; }
  .stage { inset: 70px 8px 8px; }
  .exp, .exp.no-insp { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 8px; }
  .rail { overflow-x: auto; overflow-y: hidden; padding: 0; } .rail-h { display: none; }
  .stops { display: flex; margin: 0; } .stops::before { display: none; } .rail { display: flex; gap: 4px; }
  .stop { width: auto; flex: none; max-width: 220px; } .stop.new { margin: 0; } .stop.new kbd, .stop.new > span:nth-child(2) { display: none; }
  .exp-tb #modeSeg { display: none; } #cells { padding: 14px 12px 30px; }
  .hero-col h1 { font-size: 28px; } .pg { padding: 20px 16px; }
}
.twin .tt .d { display: none; } .twin .tt b { text-align: left; }

function drawTopo() {
  const W = 1600, H = 1000, S = 12, nx = Math.ceil(W / S) + 1, ny = Math.ceil(H / S) + 1;
  const hills = [[250, 250, 250, 1], [830, 160, 290, 0.8], [1330, 320, 270, 1.1], [520, 740, 330, 0.95], [1180, 810, 290, 1], [1530, 760, 190, 0.6], [40, 860, 230, 0.7], [900, 520, 170, -0.55]];
  const f = (x, y) => { let v = 0.07 * Math.sin(x / 95) * Math.cos(y / 120); for (const [cx, cy, r, a] of hills) v += a * Math.exp(-((x - cx) ** 2 + (y - cy) ** 2) / (r * r)); return v; };
  const g = new Float32Array(nx * ny);
  for (let y = 0; y < ny; y++) for (let x = 0; x < nx; x++) g[y * nx + x] = f(x * S, y * S);
  const T = [[], [[3, 2]], [[2, 1]], [[3, 1]], [[0, 1]], [[3, 0], [2, 1]], [[0, 2]], [[3, 0]], [[3, 0]], [[0, 2]], [[0, 1], [3, 2]], [[0, 1]], [[3, 1]], [[2, 1]], [[3, 2]], []];
  const minor = [], major = [], r1 = (n) => Math.round(n * 10) / 10;
  for (let li = 0; li < 13; li++) {
    const L = 0.1 + li * 0.075, out = li % 4 === 0 ? major : minor;
    for (let y = 0; y < ny - 1; y++) for (let x = 0; x < nx - 1; x++) {
      const a = g[y * nx + x], b = g[y * nx + x + 1], c = g[(y + 1) * nx + x + 1], d = g[(y + 1) * nx + x];
      const code = (a > L) * 8 + (b > L) * 4 + (c > L) * 2 + (d > L);
      if (!code || code === 15) continue;
      const X = x * S, Y = y * S;
      const e = [() => [X + S * (L - a) / (b - a), Y], () => [X + S, Y + S * (L - b) / (c - b)], () => [X + S * (L - d) / (c - d), Y + S], () => [X, Y + S * (L - a) / (d - a)]];
      for (const [p, q] of T[code]) { const [x1, y1] = e[p](), [x2, y2] = e[q](); out.push(`M${r1(x1)} ${r1(y1)}L${r1(x2)} ${r1(y2)}`); }
    }
  }
  let grid = "", labels = "";
  for (let x = 100; x < W; x += 200) { grid += `M${x} 0V${H}`; labels += `<text x="${x + 6}" y="${H - 14}">${(26 + x / 200).toFixed(1)}°D</text>`; }
  for (let y = 100; y < H; y += 200) { grid += `M0 ${y}H${W}`; labels += `<text x="12" y="${y - 6}">${(42 - y / 200).toFixed(1)}°K</text>`; }
  const route = "M120 900C300 820 340 640 520 600S760 470 900 420 1120 300 1260 250 1420 170 1500 110";
  $("#wall").innerHTML = `<path class="gr" d="${grid}"/><path class="c" d="${minor.join("")}"/><path class="cm" d="${major.join("")}"/><g class="lb">${labels}</g>
    <path class="route" id="route" d="${route}"/><circle class="wp" cx="120" cy="900" r="5"/><circle class="wp" cx="520" cy="600" r="4"/><circle class="wp" cx="900" cy="420" r="4"/><circle class="wp" cx="1260" cy="250" r="4"/>

    <circle class="trav" r="5"><animateMotion dur="26s" repeatCount="indefinite" rotate="auto"><mpath href="#route"/></animateMotion></circle>`;
}

function startCell(q, sql) {

  cells.unshift(cell); selected = cell.id; busy = true; document.body.classList.add("busy");
  renderCells(); renderInspector(); $("#cells").scrollTop = 0;

}
async function ask(question, mode) {

  const llm = mode === "llm" || (mode === "auto" && status?.llm?.reachable && !status?.rules);
  const steps = thinking(cell.id, ["parse", llm ? "llm" : "sql", "guard", "run"], llm);
  let a; try { a = await post("/ask", { question, mode, lang }); } catch (e) { a = { ok: false, error: e.message, question }; }
  if (a.mode === "llm" && !llm) steps.relabel(1, t("think.llm"));
  await steps.finish(); finish(cell, a);
}
async function runSql(sql, title) {
  const cell = startCell(title || sql.replace(/\s+/g, " ").slice(0, 140), true);
  const steps = thinking(cell.id, ["guard", "run"]);
  let a; try { a = await post("/sql", { sql, lang, question: title || null }); } catch (e) { a = { ok: false, error: e.message, question: sql }; }
  await steps.finish(); finish(cell, a);
}
function finish(cell, a) {

  paint();
  const timer = setInterval(() => { if (stage < names.length - 1) { stage++; paint(); } }, slow ? 900 : 230);
  return { relabel(i, l) { labels[i] = l; paint(); }, async finish() { clearInterval(timer); while (stage < names.length) { stage++; paint(); await sleep(110); } } };
}

  // güvenlik denetimi

/* ---------------------------------------------------------------- SQL renklendirme */
const KW = /^(SELECT|FROM|WHERE|AND|OR|NOT|IN|IS|NULL|AS|ON|JOIN|LEFT|RIGHT|INNER|OUTER|CROSS|GROUP|BY|ORDER|HAVING|LIMIT|OFFSET|ASC|DESC|DISTINCT|WITH|UNION|ALL|CASE|WHEN|THEN|ELSE|END|BETWEEN|LIKE|OVER|PARTITION|CAST|INTEGER|REAL|TEXT|EXISTS|RECURSIVE)$/i;
function hl(sql) {
