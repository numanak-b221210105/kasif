[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kasif"
version = "1.0.0"
description = "Ask your database in Turkish: a semantic-layer rule engine plus optional LLM, with read-only, validated SQL."
readme = "README.md"
license = "MIT"
authors = [{ name = "Numan AK" }]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "openai>=1.40",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "sqlglot>=25,<31",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
kasif = "kasif.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kasif"]

[tool.pytest.ini_options]
pythonpath = ["src", ".", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ"]
ignore = ["SIM905", "SIM108", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query"]
